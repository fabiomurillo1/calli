[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calli"
version = "0.1.0"
description = "A research paper discovery and retrieval system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ "requests>=2.31", "feedparser>=6.0", "pydantic>=2.0",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"